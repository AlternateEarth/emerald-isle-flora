# ==== Gradle properties ====
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true

# ==== Mod properties (read by Stonecraft's gg.meza.stonecraft plugin) ====
# Minecraft-version-specific keys (minecraft_version, yarn_mappings, loader_version,
# fabric_version, ...) now live per-target in versions/dependencies/<mcVersion>.properties.
mod.id=emeraldisleflora
mod.name=Emerald Isle Flora
mod.version=1.6.1
mod.group=net.alternateearth
mod.description=Adds flora inspired by Ireland

# ==== Dependencies not managed per-Minecraft-version by Stonecraft ====
# Cloth Config - powers the in-game config screen (required dependency)
cloth_config_version=11.1.136
# Mod Menu - optional/soft dependency, only used to surface our config screen
modmenu_version=7.2.2

systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=60000
systemProp.org.gradle.internal.repository.max.retries=10
systemProp.org.gradle.internal.repository.initial.backoff=500