name: 'Build Mod'
description: 'Sets up JDK and Gradle, then builds the mod jar. Assumes the repo is already checked out.'
inputs:
  java-version:
    description: 'JDK version to build with'
    required: false
    default: '21'
  target:
    description: 'Chiseled Stonecutter subproject to build (e.g. "1.20.1-fabric"). Empty builds every target.'
    required: false
    default: ''
  verify-datagen:
    description: 'Also run datagen and fail if it differs from what is committed'
    required: false
    default: 'false'
  skip-build:
    description: 'Skip the "./gradlew build" step (e.g. a job that only wants verify-datagen)'
    required: false
    default: 'false'
runs:
  using: 'composite'
  steps:
    - name: Validate Gradle wrapper
      uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

    - name: Set Up JDK ${{ inputs.java-version }}
      uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
      with:
        distribution: "temurin"
        java-version: ${{ inputs.java-version }}

    - name: Make Gradle Wrapper Executable
      shell: bash
      run: chmod +x ./gradlew

    - name: Setup Gradle For Optimal Use
      uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

    - name: Verify generated worldgen data is up to date
      # Regenerates each checked-in worldgen-JSON tree from one representative Fabric
      # target on its own side of the Yarn/Mojmap split (see build.gradle.kts'
      # modSettings.generatedResources comment) - src/main/generated from a Yarn target,
      # src/main/generated-mojmap from a Mojmap-only (26.2+) one. Deliberately NOT
      # `chiseledDatagen` (every target at once): that runs multiple same-schema Fabric
      # targets' datagen in parallel against the *same* shared output directory, and their
      # independent Fabric-side stale-file-cleanup passes race on the same tracking cache
      # - confirmed locally to wrongly delete the just-regenerated, correct committed
      # files. Two targets on *different* sides of the split, one command each below, is
      # both sufficient (the JSON only depends on which side of the Stonecutter `<26.2`/
      # `>=26.2` split ran, not the exact game version within a side) and race-free. Runs
      # as its own job in the calling workflow (not per matrix leg) - it's unrelated to
      # which target(s) are being built.
      if: inputs.verify-datagen == 'true'
      shell: bash
      run: |
        ./gradlew :1.20.1-fabric:runDatagen
        ./gradlew :26.2-fabric:runDatagen
        git diff --exit-code -- src/main/generated src/main/generated-mojmap || (
          echo "::error::Generated worldgen data doesn't match what's committed. Run './gradlew :1.20.1-fabric:runDatagen :26.2-fabric:runDatagen' locally and commit the result." && exit 1
        )

    - name: Build With Gradle
      if: inputs.skip-build != 'true'
      shell: bash
      # Empty target builds every chiseled subproject in one Gradle invocation (still
      # useful standalone, e.g. a local "does everything build" check) - CI itself always
      # passes a target now, fanning the 8 targets out across separate parallel jobs
      # instead of relying on one runner's core count via org.gradle.parallel.
      run: |
        if [ -n "${{ inputs.target }}" ]; then
          ./gradlew :${{ inputs.target }}:build
        else
          ./gradlew build
        fi
