name: 'Build Mod'
description: 'Sets up JDK and Gradle, then builds the mod jar. Assumes the repo is already checked out.'
inputs:
  java-version:
    description: 'JDK version to build with'
    required: false
    default: '21'
  verify-datagen:
    description: 'Also run datagen and fail if it differs from what is committed'
    required: false
    default: 'false'
runs:
  using: 'composite'
  steps:
    - name: Validate Gradle wrapper
      uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

    - name: Set Up JDK ${{ inputs.java-version }}
      uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
      with:
        distribution: "temurin"
        java-version: ${{ inputs.java-version }}

    - name: Make Gradle Wrapper Executable
      shell: bash
      run: chmod +x ./gradlew

    - name: Setup Gradle For Optimal Use
      uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

    - name: Verify generated worldgen data is up to date
      # Regenerates each checked-in worldgen-JSON tree from one representative Fabric
      # target on its own side of the Yarn/Mojmap split (see build.gradle.kts'
      # modSettings.generatedResources comment) - src/main/generated from a Yarn target,
      # src/main/generated-mojmap from a Mojmap-only (26.2+) one. Deliberately NOT
      # `chiseledDatagen` (every target at once): that runs multiple same-schema Fabric
      # targets' datagen in parallel against the *same* shared output directory, and their
      # independent Fabric-side stale-file-cleanup passes race on the same tracking cache
      # - confirmed locally to wrongly delete the just-regenerated, correct committed
      # files. Two targets on *different* sides of the split, one command each below, is
      # both sufficient (the JSON only depends on which side of the Stonecutter `<26.2`/
      # `>=26.2` split ran, not the exact game version within a side) and race-free.
      if: inputs.verify-datagen == 'true'
      shell: bash
      run: |
        ./gradlew :1.20.1-fabric:runDatagen
        ./gradlew :26.2-fabric:runDatagen

        # Recipe/advancement JSON (ModRecipeProvider) also comes out of these same two
        # runs, but can't be git-diffed in place like worldgen's - each format group
        # lives in its own permanently-separate directory (see CONTRIBUTING.md's
        # "Adding/changing recipes" section for why), not src/main/generated(-mojmap)
        # itself. Compare each run's fresh output against its committed copy, then
        # remove the fresh copy so it doesn't pollute the worldgen git diff below.
        diff -r src/main/generated/data/emeraldisleflora/recipes src/main/generated-recipes-1.20.1/data/emeraldisleflora/recipes && \
        diff -r src/main/generated/data/emeraldisleflora/advancements src/main/generated-recipes-1.20.1/data/emeraldisleflora/advancements || (
          echo "::error::Generated recipe data doesn't match what's committed in src/main/generated-recipes-1.20.1. See CONTRIBUTING.md's 'Adding/changing recipes' section and commit the result." && exit 1
        )
        rm -rf src/main/generated/data/emeraldisleflora/recipes src/main/generated/data/emeraldisleflora/advancements

        diff -r src/main/generated-mojmap/data/emeraldisleflora/recipe src/main/generated-recipes-1.21.11-plus/data/emeraldisleflora/recipe && \
        diff -r src/main/generated-mojmap/data/emeraldisleflora/advancement src/main/generated-recipes-1.21.11-plus/data/emeraldisleflora/advancement || (
          echo "::error::Generated recipe data doesn't match what's committed in src/main/generated-recipes-1.21.11-plus. See CONTRIBUTING.md's 'Adding/changing recipes' section and commit the result." && exit 1
        )
        rm -rf src/main/generated-mojmap/data/emeraldisleflora/recipe src/main/generated-mojmap/data/emeraldisleflora/advancement

        git diff --exit-code -- src/main/generated src/main/generated-mojmap || (
          echo "::error::Generated worldgen data doesn't match what's committed. Run './gradlew :1.20.1-fabric:runDatagen :26.2-fabric:runDatagen' locally and commit the result." && exit 1
        )

    - name: Build With Gradle
      shell: bash
      run: ./gradlew build