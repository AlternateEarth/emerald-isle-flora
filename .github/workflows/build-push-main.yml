name: build-pull-merge

on:
  push:
    branches: ["main"]
    paths-ignore: ["**.md"]

env:
  JAVA_VERSION: 21

jobs:
  build:
    strategy:
      fail-fast: false
      # Must match settings.gradle.kts's mc(...) matrix - one job per chiseled
      # Stonecutter subproject, so all 8 build on separate runners in parallel instead
      # of sharing one runner's core count via Gradle's own --parallel.
      matrix:
        target:
          - 1.20.1-fabric
          - 1.20.1-forge
          - 1.21.1-fabric
          - 1.21.1-neoforge
          - 1.21.11-fabric
          - 1.21.11-neoforge
          - 26.2-fabric
          - 26.2-neoforge
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout The Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0.0

      - name: Build mod
        uses: ./.github/actions/build-mod
        with:
          java-version: ${{ env.JAVA_VERSION }}
          target: ${{ matrix.target }}

      - name: Upload built JAR
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # One artifact per target - actions/upload-artifact doesn't allow multiple
          # jobs to write into the same named artifact, so each matrix leg gets its own.
          name: emerald-isle-flora-${{ github.sha }}-${{ matrix.target }}
          path: |
            versions/${{ matrix.target }}/build/libs/*.jar
            !versions/${{ matrix.target }}/build/libs/*-sources.jar
          if-no-files-found: error

  dependency-submission:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout The Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0.0

      - name: Set up JDK ${{env.JAVA_VERSION}}
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: "temurin"
          java-version: ${{env.JAVA_VERSION}}

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Generate And Submit Dependency Graph
        uses: gradle/actions/dependency-submission@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
