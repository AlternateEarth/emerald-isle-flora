name: Release

on:
  push:
    tags: ["v*"]

env:
  JAVA_VERSION: 21
  DO_PUBLISH: "true"
  MODRINTH_TOKEN: ${{ secrets.PUBLISH_MODRINTH_TOKEN }}
  # Modrinth's own project id, gg.meza.stonecraft reads this via the MODRINTH_ID env
  # var (see build.gradle.kts's publishMods block, and Publishing.kt in Stonecraft's
  # own source - not a secret, project ids are public).
  MODRINTH_ID: fmhwwICG
  GH_TOKEN: ${{ secrets.PUBLISH_GITHUB_TOKEN }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout The Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0.0

      - name: Verify tag matches gradle.properties version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PROJECT_VERSION="$(grep '^mod.version=' gradle.properties | cut -d'=' -f2)"
          if [ "$TAG_VERSION" != "$PROJECT_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME (version $TAG_VERSION) doesn't match mod.version=$PROJECT_VERSION in gradle.properties"
            exit 1
          fi

      - name: Verify CHANGELOG.md has an entry for this version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if ! grep -q "^## \[$TAG_VERSION\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$TAG_VERSION]' section - add one before tagging (see build.gradle.kts's publishMods block, which publishes exactly that section to Modrinth for every target)."
            exit 1
          fi

      - name: Build mod (full matrix)
        uses: ./.github/actions/build-mod
        with:
          java-version: ${{ env.JAVA_VERSION }}
          verify-datagen: true

      - name: Publish to Modrinth (all targets, one invocation)
        # Fans out across every chiseled subproject automatically - see build.gradle.kts's
        # publishMods block for the per-target version/changelog/dependency wiring.
        # DO_PUBLISH=true above turns off mod-publish-plugin's default dry-run mode.
        run: ./gradlew publishMods

      - name: Extract this version's changelog section
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$TAG_VERSION" '
            /^## \[/ {
              if (found) exit
              if ($0 ~ "^## \\[" ver "\\]") { found = 1; next }
            }
            found { print }
          ' CHANGELOG.md > /tmp/release-notes.md

      - name: Create GitHub Release
        shell: bash
        run: |
          mapfile -t jars < <(find versions -path '*/build/libs/*.jar' ! -name '*-sources.jar')
          gh release create "${{ github.ref_name }}" \
            --title "Emerald Isle Flora ${{ github.ref_name }}" \
            --notes-file /tmp/release-notes.md \
            --repo "${{ github.repository }}" \
            "${jars[@]}"
