minecraft_version=1.20.1
loader_version=0.19.3
fabric_version=0.92.9+1.20.1

# Yarn stopped receiving updates after 1.21.11 (Minecraft's obfuscation removal), so
# 1.20.1+build.10 is the final/newest Yarn build for this Minecraft version.
yarn_mappings=1.20.1+build.10

# Forge - recommended build for 1.20.1 (see files.minecraftforge.net).
#
# Known issue: ./gradlew :1.20.1-forge:runClient currently crashes at Forge's own
# bootstrap ("IllegalStateException: Failed to find system mod: minecraft", thrown from
# ModSorter.detectSystemMods before this mod's code ever runs) - reproduced identically
# on both 47.4.10 and 47.3.10, and matches a known class of Architectury Loom / Forge
# 1.20.1 dev-launch bug reported by other projects, not something specific to this repo.
# ./gradlew build (compile + package) is unaffected and verified working. Revisit if a
# newer Architectury Loom release fixes it, or before shipping a real Forge release.
forge_version=1.20.1-47.4.10
