minecraft_version=1.21.11
loader_version=0.19.3
fabric_version=0.141.6+1.21.11

# Yarn stopped receiving updates after 1.21.11 (Minecraft's obfuscation removal at
# 26.1), so this is the final/newest Yarn build that will ever exist for this line.
yarn_mappings=1.21.11+build.6

# NeoForge - recommended build for 1.21.11 (see projects.neoforged.net).
neoforge_version=21.11.45

# Same shape as 1.21.1's - Architectury only publishes "1.21+build.N" for the whole
# 1.21.x line (no separate 1.21.11 build), since the Yarn intermediary namespace didn't
# change within that line. See the 1.21.1 properties file for more detail.
yarn_mappings_neoforge_patch=1.21+build.6
